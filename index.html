<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layerseven - Coming Soon</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Three.js -->
    <script src="/three.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        
        #canvas-container:active {
            cursor: grabbing;
        }
        
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            }
            50% {
                opacity: 0.8;
                text-shadow: 0 0 30px rgba(0, 204, 255, 0.5);
            }
        }
        
        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            color: #aaaaaa;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }
        
        .coming-soon {
            font-size: 2rem;
            font-weight: 500;
            color: #ffffff;
            padding: 1rem 2rem;
            border: 2px solid #00ff88;
            border-radius: 50px;
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .coming-soon {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="content">
        <h1>layerseven</h1>
        <p class="subtitle">TECH INFRASTRUCTURE & INNOVATION</p>
        <div class="coming-soon">Coming Soon</div>
    </div>
    
    <script>
        // Three.js Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        // Zoom configuration constants
        const ZOOM_MIN = 15;
        const ZOOM_MAX = 80;
        const ZOOM_WHEEL_SENSITIVITY = 0.03;
        const ZOOM_PINCH_SENSITIVITY = 0.1;
        
        // Cache pixel ratio for performance
        const pixelRatio = Math.min(window.devicePixelRatio, 2);
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(pixelRatio); // Fix blurriness on high DPI displays
        renderer.setClearColor(0x000000, 1);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Neural Network Configuration
        const layers = [8, 12, 16, 12, 8]; // Number of neurons per layer
        const layerSpacing = 10; // Increased spacing for better 3D depth
        const neuronRadius = 0.4; // Slightly larger neurons for better visibility
        const neurons = [];
        const connections = [];
        
        // Create Neural Network
        function createNeuralNetwork() {
            const totalWidth = (layers.length - 1) * layerSpacing;
            const startX = -totalWidth / 2;
            
            // Create neurons for each layer
            layers.forEach((neuronCount, layerIndex) => {
                const layerNeurons = [];
                const x = startX + layerIndex * layerSpacing;
                const totalHeight = (neuronCount - 1) * 1.5;
                const startY = -totalHeight / 2;
                
                for (let i = 0; i < neuronCount; i++) {
                    const y = startY + i * 1.5;
                    const z = 0;
                    
                    // Create neuron sphere
                    const geometry = new THREE.SphereGeometry(neuronRadius, 32, 32); // Higher detail
                    const material = new THREE.MeshPhongMaterial({
                        color: 0x00ff88,
                        transparent: true,
                        opacity: 0.9,
                        emissive: 0x00ff88,
                        emissiveIntensity: 0.3,
                        shininess: 100
                    });
                    const neuron = new THREE.Mesh(geometry, material);
                    neuron.position.set(x, y, z);
                    scene.add(neuron);
                    
                    layerNeurons.push(neuron);
                    
                    // Create connections to previous layer
                    if (layerIndex > 0) {
                        const prevLayer = neurons[layerIndex - 1];
                        prevLayer.forEach((prevNeuron) => {
                            const points = [];
                            points.push(prevNeuron.position);
                            points.push(neuron.position);
                            
                            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                            const lineMaterial = new THREE.LineBasicMaterial({
                                color: 0x00ccff,
                                transparent: true,
                                opacity: 0.2
                            });
                            const line = new THREE.Line(lineGeometry, lineMaterial);
                            scene.add(line);
                            connections.push(line);
                        });
                    }
                }
                
                neurons.push(layerNeurons);
            });
        }
        
        createNeuralNetwork();
        
        // Add lighting for better 3D appearance
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const pointLight1 = new THREE.PointLight(0x00ff88, 1, 100);
        pointLight1.position.set(20, 20, 20);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x00ccff, 0.8, 100);
        pointLight2.position.set(-20, -10, 20);
        scene.add(pointLight2);
        
        // Add ambient particles for effect
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 2000;
        const posArray = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 80;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x00ff88,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        
        camera.position.set(0, 0, 40); // Better starting position for wider view
        
        // Interactive Controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        
        // Mouse controls for desktop
        renderer.domElement.addEventListener('mousedown', (event) => {
            isDragging = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        });
        
        renderer.domElement.addEventListener('mousemove', (event) => {
            if (isDragging) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                
                cameraRotation.y += deltaX * 0.005;
                cameraRotation.x += deltaY * 0.005;
                
                // Limit vertical rotation
                cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
                
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        });
        
        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        renderer.domElement.addEventListener('mouseleave', () => {
            isDragging = false;
        });
        
        // Touch controls for mobile
        let touches = [];
        let lastPinchDistance = 0;
        
        renderer.domElement.addEventListener('touchstart', (event) => {
            event.preventDefault();
            touches = Array.from(event.touches);
            if (touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: touches[0].clientX, y: touches[0].clientY };
            } else if (touches.length === 2) {
                // Initialize pinch to zoom
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                lastPinchDistance = Math.sqrt(dx * dx + dy * dy);
                isDragging = false;
            }
        }, { passive: false });
        
        renderer.domElement.addEventListener('touchmove', (event) => {
            event.preventDefault();
            touches = Array.from(event.touches);
            
            if (touches.length === 1 && isDragging) {
                const deltaX = touches[0].clientX - previousMousePosition.x;
                const deltaY = touches[0].clientY - previousMousePosition.y;
                
                cameraRotation.y += deltaX * 0.005;
                cameraRotation.x += deltaY * 0.005;
                
                // Limit vertical rotation
                cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
                
                previousMousePosition = { x: touches[0].clientX, y: touches[0].clientY };
            } else if (touches.length === 2) {
                // Pinch to zoom
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (lastPinchDistance > 0) {
                    const delta = distance - lastPinchDistance;
                    camera.position.z -= delta * ZOOM_PINCH_SENSITIVITY;
                    camera.position.z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camera.position.z));
                }
                
                lastPinchDistance = distance;
            }
        }, { passive: false });
        
        renderer.domElement.addEventListener('touchend', (event) => {
            event.preventDefault();
            isDragging = false;
            touches = [];
            lastPinchDistance = 0;
        }, { passive: false });
        
        // Zoom with mouse wheel
        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            camera.position.z += event.deltaY * ZOOM_WHEEL_SENSITIVITY; // Smoother zoom
            camera.position.z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camera.position.z)); // Wider zoom range
        }, { passive: false });
        
        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            // Rotate particles slowly for depth perception
            particlesMesh.rotation.y += 0.0005;
            particlesMesh.rotation.x += 0.0002;
            
            // Pulse neurons with improved animation
            neurons.forEach((layer, layerIndex) => {
                layer.forEach((neuron, neuronIndex) => {
                    const pulse = Math.sin(time + layerIndex * 0.5 + neuronIndex * 0.1) * 0.15 + 0.85;
                    neuron.scale.set(pulse, pulse, pulse);
                    neuron.material.opacity = 0.7 + pulse * 0.2;
                    // Add subtle rotation to each layer for 3D effect
                    const layerRotation = Math.sin(time * 0.3 + layerIndex) * 0.05;
                    neuron.rotation.y = layerRotation;
                });
            });
            
            // Pulse connections
            connections.forEach((connection, index) => {
                const pulse = Math.sin(time * 2 + index * 0.05) * 0.15 + 0.2;
                connection.material.opacity = pulse;
            });
            
            // Animate lights for dynamic effect
            pointLight1.position.x = Math.sin(time * 0.5) * 25;
            pointLight1.position.z = Math.cos(time * 0.5) * 25;
            
            // Update camera position based on rotation
            const radius = camera.position.z;
            camera.position.x = radius * Math.sin(cameraRotation.y) * Math.cos(cameraRotation.x);
            camera.position.y = radius * Math.sin(cameraRotation.x);
            camera.position.z = radius * Math.cos(cameraRotation.y) * Math.cos(cameraRotation.x);
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(pixelRatio);
        });
    </script>
</body>
</html>
