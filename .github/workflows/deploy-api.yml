name: Deploy API
on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep remote dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: mkdir -p /home/haily/api

      - name: Rsync to VM
        uses: burnett01/rsync-deployments@v6.0
        with:
          switches: -avzr --delete
          path: api/
          remote_path: /home/haily/api/
          remote_host: ${{ secrets.VM_HOST }}
          remote_user: ${{ secrets.VM_USER }}
          remote_key: ${{ secrets.VM_SSH_KEY }}

      - name: Restart API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: sudo systemctl restart api

      - name: Health check
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://api.layerseven.tech/health)
          echo "Health HTTP code: $code"
          if [ "$code" -ne 200 ]; then
            exit 1
          fi

