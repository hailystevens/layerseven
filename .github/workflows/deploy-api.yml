name: Deploy API

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Ensure rsync present
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Prep remote dir
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'mkdir -p /home/haily/api'

      - name: Rsync to VM
        run: |
          rsync -avzr --delete -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
            api/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/haily/api/

      - name: Restart API service
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'sudo systemctl restart api && systemctl is-active api'

      - name: Health check
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://api.layerseven.tech/health)
          echo "Health HTTP code: $code"
          test "$code" = "200"
