name: Deploy API
on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

     - name: Prepare remote dir
       run: |
         ssh -i key.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'mkdir -p ~/api'

     - name: Rsync to VM (no node_modules/.git)
       run: |
         rsync -avzr --delete \
            --exclude 'node_modules/' --exclude '.git/' --exclude '.DS_Store' \
            -e "ssh -i key.pem" \
            api/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/haily/api/

     - name: Install deps & restart
       run: |
         ssh -i key.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
         'cd ~/api && npm ci --omit=dev && sudo -n systemctl restart api && sudo -n systemctl is-active api' 

      - name: Health check
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://api.layerseven.tech/health)
          echo "HTTP $code"
          test "$code" = "200"
